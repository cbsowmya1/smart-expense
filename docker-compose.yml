version: "3.9"
services:
  db:
    image: postgres:16
    container_name: smart-expense-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expensedb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expensedb"]
      interval: 5s
      timeout: 3s
      retries: 10
