spring.application.name=expense-workflow-service
spring.datasource.url=jdbc:postgresql://localhost:5432/expensedb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8080
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.data-source-properties.options=-c TimeZone=Asia/Kolkata
app.jwt.secret=change_this_to_a_long_random_secret_value_0123456789abcdefXYZ
app.jwt.expMinutes=60
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG